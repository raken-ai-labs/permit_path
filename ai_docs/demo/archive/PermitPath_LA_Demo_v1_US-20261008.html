<title>PermitPath LA Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: guided host journey. Left rail of 7 stages, one focused card per step, sticky action bar. Single light look by choice. */
:root{
  --coral:#F2475F; --coral-d:#D8304A; --coral-soft:#FFF0F2;
  --teal:#0E8A86; --teal-soft:#E6F5F4;
  --ink:#1F1D1E; --ink-2:#5E585B; --ink-3:#8D8689;
  --line:#ECE6E8; --paper:#FFFFFF; --ground:#FAF7F7;
  --ok:#1C8A55; --ok-soft:#E7F5EE; --warn:#B76E00; --warn-soft:#FFF4E0; --bad:#C2283E; --bad-soft:#FDECEE;
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:8px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--coral)}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--coral);display:grid;place-items:center;color:#fff}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.spacer{flex:1}
.by{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.by img{height:30px;width:auto}
.view-toggle{display:flex;background:var(--ground);border:1px solid var(--line);border-radius:999px;padding:3px}
.view-toggle button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-2)}
.view-toggle button[aria-pressed="true"]{background:var(--ink);color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 120px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
.rail{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:4px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
.persona{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#FFB3BE,#F2475F);color:#fff;display:grid;place-items:center;font-weight:800}
.persona small{display:block;color:var(--ink-3);font-size:12px;line-height:1.35}
.stage{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:12px;color:var(--ink-3);cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.stage .dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--paper)}
.stage b{display:block;font-size:13.5px;color:inherit;font-weight:600}
.stage span.sub{display:block;font-size:12px}
.stage.done{color:var(--ink-2)} .stage.done .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.stage.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)} .stage.on .dot{border-color:var(--coral);color:var(--coral)}
main{min-width:0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral)}
h1{font-size:clamp(26px,3.2vw,34px);line-height:1.15;letter-spacing:-.025em;margin:6px 0 8px;text-wrap:balance}
h2{font-size:19px;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:15px;margin:0 0 4px}
p.lead{color:var(--ink-2);font-size:16px;max-width:64ch;margin:0 0 20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.input{width:100%;border:1px solid #DCD5D8;border-radius:12px;padding:12px 14px;background:#fff}
.input:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(31,29,30,.08)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--coral);color:#fff;transition:background .15s}
.btn:hover{background:var(--coral-d)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #D6CFD2}
.btn.ghost:hover{background:var(--ground)}
.btn.dark{background:var(--ink)} .btn.dark:hover{background:#000}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.n{background:var(--ground);color:var(--ink-2);border:1px solid var(--line)} .chip.t{background:var(--teal-soft);color:var(--teal)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:600}
.mono{font-family:var(--mono);font-size:13px}
.verdict{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:var(--ok-soft)}
.verdict.warn{background:var(--warn-soft)}
.verdict .big{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;background:var(--ok);flex:none}
.verdict.warn .big{background:var(--warn)}
.q{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .txt{min-width:0} .q small{display:block;color:var(--ink-3);font-size:12.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.term{border-bottom:1px dotted var(--ink-3);cursor:help}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.total td{font-weight:800;border-bottom:0;font-size:15px}
.tblwrap{overflow-x:auto}
.src{font-size:12px;color:var(--ink-3)}
.gantt{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:8px 12px;font-size:13px;align-items:center}
.gbar{position:relative;height:26px;background:var(--ground);border-radius:8px}
.gbar i{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--teal)}
.gbar i.crit{background:var(--coral)}
.drop{border:2px dashed #D6CFD2;border-radius:16px;padding:22px;text-align:center;background:var(--ground);cursor:pointer}
.drop:hover{border-color:var(--coral)}
.doc{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.doc .ico{width:38px;height:46px;border-radius:6px;background:var(--ground);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3);flex:none}
.doc .meta{min-width:0;flex:1}
.vault{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--teal-soft);color:#0B5F5C;font-size:13.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.check:first-child{border-top:0}
.ring{position:relative;width:180px;height:180px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-size:46px;letter-spacing:-.03em;line-height:1}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600;background:#fff}
.badge.locked{opacity:.45}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .6s}
.paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 8px 24px rgba(31,29,30,.06);font-size:13px}
.paper h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.timeline{position:relative;height:56px;margin:8px 0 4px}
.timeline .track{position:absolute;left:0;right:0;top:24px;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--ok-soft) 0 45%,var(--warn-soft) 45% 75%,var(--bad-soft) 75%)}
.timeline .you{position:absolute;top:10px;width:3px;height:36px;background:var(--ink);border-radius:2px}
.timeline .lab{position:absolute;top:-6px;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow:auto;padding:4px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14px}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--ground);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .cite{display:block;margin-top:6px;font-size:12px;color:var(--teal);font-weight:600}
.cohost{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.cal div{height:34px;border-radius:6px;background:var(--ground);font-size:10px;display:grid;place-items:center;color:var(--ink-3);font-weight:700}
.cal div.hot{background:#FFD7DE;color:var(--coral-d)}
.cal div.mid{background:#FFE9EC;color:var(--coral-d)}
.cal div.due{background:var(--ink);color:#fff}
.prop{display:grid;grid-template-columns:1fr auto;gap:6px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.kpi{padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--ink-3)}
.funnel{display:flex;flex-direction:column;gap:8px}
.funnel .fr{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.funnel .fb{height:22px;border-radius:6px;background:var(--coral)}
.funnel .fb.h{background:#C9C2C5}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.actionbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.progress{flex:1;min-width:0}
.progress .bar{height:6px}
.progress small{color:var(--ink-3);font-size:12px}
.note{font-size:12px;color:var(--ink-3)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
.scan{position:relative;overflow:hidden}
.scan::after{content:"";position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(180deg,transparent,rgba(242,71,95,.18),transparent);animation:scan 1.1s linear infinite}
@keyframes scan{to{top:100%}}
.legal{font-size:11.5px;color:var(--ink-3);margin-top:28px;max-width:80ch}
</style>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>"$"+n.toLocaleString("en-US");

const STAGES=[
 {n:1,t:"Can I operate here?",s:"Address, blockers, cost"},
 {n:2,t:"What do I need?",s:"Plan, documents, score"},
 {n:3,t:"Assemble and file",s:"Filing pack"},
 {n:4,t:"After filing",s:"Wait, denial, options"},
 {n:5,t:"Help at any step",s:"Assistant, co-host"},
 {n:6,t:"Staying compliant",s:"Renewal, properties"},
 {n:7,t:"For Airbnb",s:"Program dashboard"}];

const S={step:0,addr:"4127 Rosewood Ave, Los Angeles, CA 90004",owns:false,resolved:false,
 gates:{primary:"yes",only:"yes",rso:"auto",adu:"na",space:"yes",cit:"yes",hoa:"unsure"},
 docs:[],scanning:false,fixedRes:false,fixedName:false,filed:false,denial:null,chat:[],handoff:false,stays:64};

const STEPS=[
 {stage:1,id:"address",render:rAddress,ready:()=>S.resolved},
 {stage:1,id:"eligibility",render:rElig},
 {stage:1,id:"cost",render:rCost},
 {stage:2,id:"plan",render:rPlan},
 {stage:2,id:"docs",render:rDocs,ready:()=>S.docs.length>0&&!S.scanning},
 {stage:2,id:"score",render:rScore},
 {stage:3,id:"pack",render:rPack},
 {stage:4,id:"wait",render:rWait},
 {stage:4,id:"denial",render:rDenial},
 {stage:5,id:"help",render:rHelp},
 {stage:6,id:"renew",render:rRenew},
 {stage:7,id:"programme",render:rProgramme}];

function rail(){
 const cur=STEPS[S.step].stage;
 $("#rail").innerHTML=`<div class="persona"><div class="avatar">SR</div><div><b>Sofia Ramirez</b><small>Prospective buyer, wants to host while living on site. First time applying.</small></div></div>`+
 STAGES.map(st=>`<button class="stage ${st.n<cur?"done":st.n==cur?"on":""}" data-stage="${st.n}"><span class="dot">${st.n<cur?"✓":st.n}</span><span><b>${st.t}</b><span class="sub">${st.s}</span></span></button>`).join("");
 document.querySelectorAll(".stage").forEach(b=>b.onclick=()=>{go(STEPS.findIndex(x=>x.stage==+b.dataset.stage))});
}
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));render();window.scrollTo({top:0,behavior:"smooth"});}
let lastStep=-1;
function render(){
 const st=STEPS[S.step]; const anim=lastStep!==S.step; lastStep=S.step;
 $("#main").innerHTML=`<div class="${anim?"fade":""}">${st.render()}</div><p class="legal">PermitPath LA is a Raken AI Labs demo built for discussion. All addresses, people and outcomes are fictional sample data. Rules and fees shown reflect research as of September 2026, adjust on CPI schedules and must be verified with the issuing agency. Not legal advice.</p>`;
 st.after&&st.after();
 (BIND[st.id]||(()=>{}))();
 rail();
 $("#pbar").style.width=((S.step+1)/STEPS.length*100)+"%";
 $("#ptxt").textContent=`Step ${S.step+1} of ${STEPS.length} · ${STAGES[st.stage-1].t}`;
 $("#back").disabled=S.step==0; $("#back").style.visibility=S.step==0?"hidden":"visible";
 const ok=!st.ready||st.ready();
 $("#next").disabled=!ok; $("#next").style.opacity=ok?1:.45;
 $("#next").textContent=S.step==STEPS.length-1?"Restart demo":"Continue";
 $("#vHost").setAttribute("aria-pressed",st.id!="programme"); $("#vProg").setAttribute("aria-pressed",st.id=="programme");
}
$("#next").onclick=()=>{ if(S.step==STEPS.length-1){location.reload();return;} go(S.step+1); };
$("#back").onclick=()=>go(S.step-1);
$("#vProg").onclick=()=>go(STEPS.length-1);
$("#vHost").onclick=()=>{ if(STEPS[S.step].id=="programme") go(0); };

/* ---------- STAGE 1 ---------- */
function rAddress(){
 return `<div class="eyebrow">Stage 1 · Can I operate here?</div>
 <h1>Start with an address. No account needed.</h1>
 <p class="lead">The city on your mail is not always the city that regulates you. We resolve the address to its parcel, then to the rule set that actually governs it.</p>
 <div class="card stack">
  <div><label class="f" for="addr">Property address</label>
   <div class="row"><input class="input" id="addr" style="flex:1;min-width:220px" value="${esc(S.addr)}"><button class="btn" id="resolve">Check this address</button></div></div>
  <div class="row"><button class="opt" id="own" aria-pressed="${!S.owns}" style="width:auto">I'm thinking of buying this home</button><button class="opt" id="own2" aria-pressed="${S.owns}" style="width:auto">I already own or rent it</button></div>
  <div id="res">${S.resolved?resolved():`<p class="note">Try the sample address, or type any LA address. This demo always resolves to the same sample parcel.</p>`}</div>
 </div>`;
}
function resolved(){
 return `<div class="grid2 fade">
  <div class="card" style="padding:18px"><h3>Parcel found</h3><dl class="kv">
   <dt>Jurisdiction</dt><dd>City of Los Angeles</dd><dt>Rule set</dt><dd>Home-Sharing Ordinance (HSO)</dd>
   <dt>APN</dt><dd class="mono">5521-018-0XX</dd><dt>Zoning</dt><dd>R2, two-family</dd><dt>Year built</dt><dd>1987</dd>
   <dt>RSO</dt><dd><span class="chip ok">Not covered</span></dd></dl>
   <p class="src" style="margin-top:10px">Resolved from parcel data (ZIMAS). Verified Sep 18, 2026.</p></div>
  <div class="card" style="padding:18px"><h3>What applies here</h3><dl class="kv">
   <dt>Hosting type</dt><dd>Primary residence only</dd><dt>Night cap</dt><dd>120 nights a year (Standard)</dd>
   <dt>Occupancy tax</dt><dd>14%, collected by the platform</dd><dt>Agency</dt><dd>LA City Planning, Home-Sharing Unit</dd></dl>
   ${!S.owns?`<div class="chip t" style="margin-top:12px">Pre-purchase check: nothing is filed until you own or rent</div>`:""}</div></div>`;
